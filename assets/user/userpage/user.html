<!-- Include this in assets/user/userpage/user.html Script Section -->
<script>
    async function handleLogout(event) {
        if (event) event.preventDefault();

        try {
            if (typeof _supabase !== 'undefined' && _supabase.auth) {
                await _supabase.auth.signOut();
            }

            const savedTheme = localStorage.getItem('theme');
            const savedLang = localStorage.getItem('lang');

            sessionStorage.clear();
            localStorage.clear();

            if (savedTheme) localStorage.setItem('theme', savedTheme);
            if (savedLang) localStorage.setItem('lang', savedLang);
        } catch (err) {
            console.warn("Logout error:", err);
        } finally {
            // Safe Relative Path Navigation to Root index.html from user.html
            const pathSegments = window.location.pathname.split('/').filter(Boolean);
            let targetRoot = '../../../index.html';

            if (window.location.protocol === 'file:') {
                targetRoot = '../../../index.html';
            } else if (window.location.pathname.includes('/assets/')) {
                const assetsIndex = pathSegments.indexOf('assets');
                const depth = pathSegments.length - assetsIndex - 1;
                targetRoot = '../'.repeat(depth) + 'index.html';
            } else {
                targetRoot = window.location.origin + '/index.html';
            }

            window.location.href = targetRoot;
        }
    }
</script>
