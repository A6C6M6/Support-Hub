<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Hub - Public Portal</title>
    
    <!-- CSS Dependencies -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --primary-blue: #1e3a8a;
            --secondary-bg: #f8fafc;
            --sidebar-bg: #0f172a;
            --sidebar-text: #94a3b8;
            --sidebar-active: #38bdf8;
            --card-border: #e2e8f0;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --header-height: 70px;
            --sidebar-width: 260px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--secondary-bg);
            color: var(--text-dark);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            z-index: 1000;
        }

        .sidebar-header {
            height: var(--header-height);
            display: flex;
            align-items: center;
            padding: 0 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .sidebar-brand {
            color: #ffffff;
            font-size: 1.25rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .sidebar-brand i { color: var(--sidebar-active); }

        .sidebar-menu {
            list-style: none;
            padding: 1.5rem 0.75rem;
            overflow-y: auto;
            flex-grow: 1;
        }

        .sidebar-menu li { margin-bottom: 0.25rem; }

        .sidebar-menu a {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.75rem 1rem;
            color: var(--sidebar-text);
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .sidebar-menu a:hover, .sidebar-menu li.active a {
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--sidebar-active);
        }

        .main-wrapper {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            height: var(--header-height);
            background-color: #ffffff;
            border-bottom: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2rem;
        }

        .header-area {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .header-search { position: relative; }

        .header-search input {
            padding: 0.5rem 1rem 0.5rem 2.5rem;
            border-radius: 20px;
            border: 1px solid var(--card-border);
            outline: none;
            width: 250px;
        }

        .header-search i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background-color: var(--primary-blue);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
        }

        .btn {
            padding: 0.5rem 1rem;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background-color: #e2e8f0;
        }

        .content-body {
            flex-grow: 1;
            padding: 2rem;
            overflow-y: auto;
        }

        .modules-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.5rem;
        }

        .module-card {
            background: #ffffff;
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 1.5rem;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .module-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .module-icon {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            margin-bottom: 1rem;
            background: #e0f2fe;
            color: #0284c7;
        }

        .live-badge {
            background-color: #dcfce7;
            color: #15803d;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.25rem 0.6rem;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background-color: #22c55e;
            border-radius: 50%;
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-brand">
                <i class="fa-solid fa-layer-group"></i>
                <span>Support Hub</span>
            </div>
        </div>
        <ul class="sidebar-menu" id="sidebarMenu"></ul>
    </aside>

    <div class="main-wrapper">
        <header class="header">
            <div class="header-area" id="headerLeftArea"></div>
            <div class="header-area" id="headerCenterArea"></div>
            <div class="header-area" id="headerRightArea"></div>
        </header>

        <main class="content-body" id="mainContent"></main>
    </div>

    <script>
        let currentLanguage = 'en';
        let activePageKey = 'dashboard';
        let globalConfig = null;

        const SUPABASE_URL = 'https://qhcxxzjibfzjkrpskjjj.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_dLXC9Vp7BaBxYRz153pq0Q_b1qWG4xV';
        
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function fetchLiveConfig() {
            try {
                let { data, error } = await _supabase
                    .from('app_config')
                    .select('config_data')
                    .eq('id', 1)
                    .single();

                if (error || !data) {
                    console.error("Data fetch error:", error);
                    return null;
                }
                return data.config_data;
            } catch (err) {
                console.error("Fetch exception:", err);
                return null;
            }
        }

        _supabase
            .channel('public:app_config')
            .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'app_config' }, async () => {
                await updateUI();
            })
            .subscribe();

        async function updateUI() {
            const cfg = await fetchLiveConfig();
            if (!cfg) return;
            
            globalConfig = cfg;
            renderHeader(cfg.headerItems || []);
            renderSidebar(cfg.sidebar || {});
            loadPageContent(activePageKey);
        }

        function renderHeader(headerItems) {
            const left = document.getElementById('headerLeftArea');
            const center = document.getElementById('headerCenterArea');
            const right = document.getElementById('headerRightArea');

            left.innerHTML = ''; center.innerHTML = ''; right.innerHTML = '';

            const items = [...headerItems].sort((a,b) => a.order - b.order);

            items.forEach(item => {
                if(!item.show) return;
                let elem = document.createElement('div');
                
                if(item.type === 'search') {
                    elem.className = 'header-search';
                    elem.innerHTML = `<i class="fa-solid fa-magnifying-glass"></i><input type="text" placeholder="Search portal...">`;
                } else if(item.type === 'language') {
                    elem.innerHTML = `<button class="btn" onclick="toggleLanguage()"><i class="fa-solid fa-globe"></i> ${currentLanguage.toUpperCase()}</button>`;
                } else if(item.type === 'profile') {
                    elem.className = 'user-profile';
                    elem.innerHTML = `<div class="avatar"><i class="fa-solid fa-user"></i></div><span>Guest User</span>`;
                }

                if(item.position === 'left') left.appendChild(elem);
                else if(item.position === 'center') center.appendChild(elem);
                else right.appendChild(elem);
            });
        }

        function renderSidebar(sidebarConfig) {
            const sidebarMenu = document.getElementById('sidebarMenu');
            sidebarMenu.innerHTML = '';

            const keys = Object.keys(sidebarConfig).sort((a, b) => (sidebarConfig[a].order || 0) - (sidebarConfig[b].order || 0));

            keys.forEach(key => {
                const item = sidebarConfig[key];
                if (item.show !== false) {
                    const li = document.createElement('li');
                    if (key === activePageKey) li.classList.add('active');

                    const displayName = currentLanguage === 'ml' ? (item.nameMl || key) : (item.nameEn || key);
                    li.innerHTML = `<a href="#"><i class="${item.icon || 'fa-solid fa-folder'}"></i> <span>${displayName}</span></a>`;
                    
                    li.addEventListener('click', function(e) {
                        e.preventDefault();
                        activePageKey = key;
                        document.querySelectorAll('#sidebarMenu li').forEach(i => i.classList.remove('active'));
                        this.classList.add('active');
                        loadPageContent(key);
                    });
                    sidebarMenu.appendChild(li);
                }
            });
        }

        function loadPageContent(pageKey) {
            const mainContent = document.getElementById('mainContent');
            if(!globalConfig || !globalConfig.sidebar) return;

            const pageData = globalConfig.sidebar[pageKey];

            if(!pageData) {
                mainContent.innerHTML = `<h2>Page Not Found</h2>`;
                return;
            }

            let html = `
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 2rem;">
                <h2>${currentLanguage === 'ml' ? (pageData.nameMl || pageKey) : (pageData.nameEn || pageKey)}</h2>
                <div class="live-badge">
                    <span class="live-dot"></span> Live Synced
                </div>
            </div>`;

            html += `<div class="modules-grid">`;
            
            const modules = pageData.modules || [];
            if(modules.length > 0) {
                modules.forEach(mod => {
                    const title = currentLanguage === 'ml' ? (mod.nameMl || mod.nameEn || mod.name) : (mod.nameEn || mod.name);
                    const iconClass = mod.icon || 'fa-solid fa-cube';
                    
                    html += `
                        <div class="module-card">
                            <div class="module-icon">
                                <i class="${iconClass}"></i>
                            </div>
                            <h3>${title}</h3>
                        </div>
                    `;
                });
            } else {
                html += `<p style="color:var(--text-muted);">No services available under this section.</p>`;
            }
            html += `</div>`;

            mainContent.innerHTML = html;
        }

        function toggleLanguage() {
            currentLanguage = currentLanguage === 'en' ? 'ml' : 'en';
            if(globalConfig) {
                renderHeader(globalConfig.headerItems || []);
                renderSidebar(globalConfig.sidebar || {});
                loadPageContent(activePageKey);
            }
        }

        document.addEventListener('DOMContentLoaded', updateUI);
    </script>
</body>
</html>
