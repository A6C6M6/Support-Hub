<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Hub - Admin Settings Dashboard</title>
    
    <!-- CSS Dependencies -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --primary-blue: #1e3a8a;
            --primary-hover: #1e40af;
            --secondary-bg: #f8fafc;
            --sidebar-bg: #0f172a;
            --sidebar-text: #94a3b8;
            --sidebar-active: #38bdf8;
            --card-border: #e2e8f0;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --header-height: 70px;
            --sidebar-width: 260px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--secondary-bg);
            color: var(--text-dark);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            z-index: 1000;
        }

        .sidebar-header {
            height: var(--header-height);
            display: flex;
            align-items: center;
            padding: 0 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .sidebar-brand {
            color: #ffffff;
            font-size: 1.25rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .sidebar-brand i { color: var(--sidebar-active); }

        .sidebar-menu {
            list-style: none;
            padding: 1.5rem 0.75rem;
            overflow-y: auto;
            flex-grow: 1;
        }

        .sidebar-menu li { margin-bottom: 0.25rem; }

        .sidebar-menu a {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.75rem 1rem;
            color: var(--sidebar-text);
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .sidebar-menu a:hover, .sidebar-menu li.active a {
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--sidebar-active);
        }

        .main-wrapper {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            height: var(--header-height);
            background-color: #ffffff;
            border-bottom: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2rem;
        }

        .header-area {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .header-search { position: relative; }

        .header-search input {
            padding: 0.5rem 1rem 0.5rem 2.5rem;
            border-radius: 20px;
            border: 1px solid var(--card-border);
            outline: none;
            width: 250px;
        }

        .header-search i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            cursor: pointer;
        }

        .avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background-color: var(--primary-blue);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
        }

        .content-body {
            flex-grow: 1;
            padding: 2rem;
            overflow-y: auto;
        }

        .modules-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .module-card {
            background: #ffffff;
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 1.5rem;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
        }

        .module-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .module-icon {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }

        .admin-controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .btn {
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: background 0.2s;
        }

        .btn-primary {
            background-color: var(--primary-blue);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .modal-backdrop {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .modal {
            background: white;
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            padding: 2rem;
        }

        .form-group { margin-bottom: 1.2rem; }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 0.6rem;
            border-radius: 6px;
            border: 1px solid var(--card-border);
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-brand">
                <i class="fa-solid fa-layer-group"></i>
                <span>Support Hub</span>
            </div>
        </div>
        <ul class="sidebar-menu" id="sidebarMenu"></ul>
    </aside>

    <div class="main-wrapper">
        <header class="header">
            <div class="header-area" id="headerLeftArea"></div>
            <div class="header-area" id="headerCenterArea"></div>
            <div class="header-area" id="headerRightArea"></div>
        </header>

        <main class="content-body" id="mainContent"></main>
    </div>

    <div class="modal-backdrop" id="addModuleModal">
        <div class="modal">
            <h3 style="margin-bottom: 1.5rem;">Add New Module</h3>
            <div class="form-group">
                <label>Page Title (Key)</label>
                <input type="text" id="modPageKey" placeholder="e.g. analytics">
            </div>
            <div class="form-group">
                <label>Module Name (English)</label>
                <input type="text" id="modNameEn" placeholder="Analytics Dashboard">
            </div>
            <div class="form-group">
                <label>Module Name (Malayalam)</label>
                <input type="text" id="modNameMl" placeholder="അനലിറ്റിക്സ് ഡാഷ്‌ബോർഡ്">
            </div>
            <div class="form-group">
                <label>Icon Class (FontAwesome)</label>
                <input type="text" id="modIcon" placeholder="fa-solid fa-chart-line">
            </div>
            <div style="display: flex; justify-content: flex-end; gap: 1rem;">
                <button class="btn" style="background:#cbd5e1;" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" onclick="saveNewModule()">Save Module</button>
            </div>
        </div>
    </div>

    <script>
        const initialDefaultConfig = {
            headerItems: [
                { id: "search", order: 1, position: "left", show: true, type: "search" },
                { id: "lang", order: 2, position: "right", show: true, type: "language" },
                { id: "profile", order: 3, position: "right", show: true, type: "profile" }
            ],
            sidebar: {
                "dashboard": { order: 1, nameEn: "Dashboard", nameMl: "ഡാഷ്‌ബോർഡ്", icon: "fa-solid fa-house", show: true, enable: true, modules: [] },
                "settings": { order: 2, nameEn: "Settings", nameMl: "ക്രമീകരണങ്ങൾ", icon: "fa-solid fa-gear", show: true, enable: true, modules: [] }
            }
        };

        let currentLanguage = 'en';
        let activePageKey = 'dashboard';

        // Corrected Supabase URL without `/rest/v1/`
        const SUPABASE_URL = 'https://qhcxxzjibfzjkrpskjjj.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_dLXC9Vp7BaBxYRz153pq0Q_b1qWG4xV';
        
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function getSavedConfig() {
            try {
                let { data, error } = await _supabase
                    .from('app_config')
                    .select('config_data')
                    .eq('id', 1)
                    .single();

                if (error || !data) return initialDefaultConfig;
                return data.config_data;
            } catch (err) {
                return initialDefaultConfig;
            }
        }

        async function broadcastConfigChange(updatedConfig) {
            try {
                const { error } = await _supabase
                    .from('app_config')
                    .update({ config_data: updatedConfig })
                    .eq('id', 1);

                if (error) {
                    console.error("Supabase Save Error:", error);
                    alert("Failed to save changes to Supabase!");
                } else {
                    console.log("Config saved to Supabase successfully.");
                }
            } catch (err) {
                console.error("Save Error:", err);
            }
        }

        _supabase
            .channel('public:app_config')
            .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'app_config' }, async () => {
                await syncUIFromConfig();
            })
            .subscribe();

        async function syncUIFromConfig() {
            const cfg = await getSavedConfig();
            renderHeader(cfg.headerItems || []);
            renderSidebar(cfg.sidebar || {});
        }

        function renderHeader(headerItems) {
            const left = document.getElementById('headerLeftArea');
            const center = document.getElementById('headerCenterArea');
            const right = document.getElementById('headerRightArea');

            left.innerHTML = ''; center.innerHTML = ''; right.innerHTML = '';

            const items = [...headerItems].sort((a,b) => a.order - b.order);

            items.forEach(item => {
                if(!item.show) return;
                let elem = document.createElement('div');
                
                if(item.type === 'search') {
                    elem.className = 'header-search';
                    elem.innerHTML = `<i class="fa-solid fa-magnifying-glass"></i><input type="text" placeholder="Search portal...">`;
                } else if(item.type === 'language') {
                    elem.innerHTML = `<button class="btn" style="background:#e2e8f0;" onclick="toggleLanguage()"><i class="fa-solid fa-globe"></i> ${currentLanguage.toUpperCase()}</button>`;
                } else if(item.type === 'profile') {
                    elem.className = 'user-profile';
                    elem.innerHTML = `<div class="avatar">A</div><span>Admin</span>`;
                }

                if(item.position === 'left') left.appendChild(elem);
                else if(item.position === 'center') center.appendChild(elem);
                else right.appendChild(elem);
            });
        }

        function renderSidebar(sidebarConfig) {
            const sidebarMenu = document.getElementById('sidebarMenu');
            sidebarMenu.innerHTML = '';

            const keys = Object.keys(sidebarConfig).sort((a, b) => (sidebarConfig[a].order || 0) - (sidebarConfig[b].order || 0));

            keys.forEach(key => {
                const item = sidebarConfig[key];
                if (item.show !== false) {
                    const li = document.createElement('li');
                    if (key === activePageKey) li.classList.add('active');

                    const displayName = currentLanguage === 'ml' ? (item.nameMl || key) : (item.nameEn || key);
                    li.innerHTML = `<a href="#"><i class="${item.icon || 'fa-solid fa-folder'}"></i> <span>${displayName}</span></a>`;
                    
                    li.addEventListener('click', function(e) {
                        e.preventDefault();
                        activePageKey = key;
                        document.querySelectorAll('#sidebarMenu li').forEach(i => i.classList.remove('active'));
                        this.classList.add('active');
                        loadPageContent(key);
                    });
                    sidebarMenu.appendChild(li);
                }
            });
        }

        async function loadPageContent(pageKey) {
            const cfg = await getSavedConfig();
            const mainContent = document.getElementById('mainContent');
            const pageData = cfg.sidebar[pageKey];

            if(!pageData) {
                mainContent.innerHTML = `<h2>Page Not Found</h2>`;
                return;
            }

            let html = `<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 2rem;">
                <h2>${currentLanguage === 'ml' ? (pageData.nameMl || pageKey) : (pageData.nameEn || pageKey)}</h2>
                <div class="admin-controls">
                    <button class="btn btn-primary" onclick="openModal()"><i class="fa-solid fa-plus"></i> Add Module</button>
                </div>
            </div>`;

            html += `<div class="modules-grid">`;
            if(pageData.modules && pageData.modules.length > 0) {
                pageData.modules.forEach(mod => {
                    html += `
                        <div class="module-card">
                            <div class="module-icon" style="background:#e0f2fe; color:#0284c7;">
                                <i class="${mod.icon}"></i>
                            </div>
                            <h3>${currentLanguage === 'ml' ? (mod.nameMl || mod.nameEn) : mod.nameEn}</h3>
                        </div>
                    `;
                });
            } else {
                html += `<p style="color:var(--text-muted);">No modules added to this section yet.</p>`;
            }
            html += `</div>`;

            mainContent.innerHTML = html;
        }

        async function toggleLanguage() {
            currentLanguage = currentLanguage === 'en' ? 'ml' : 'en';
            await syncUIFromConfig();
            loadPageContent(activePageKey);
        }

        function openModal() { document.getElementById('addModuleModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('addModuleModal').style.display = 'none'; }

        async function saveNewModule() {
            const pageKey = document.getElementById('modPageKey').value.trim();
            const nameEn = document.getElementById('modNameEn').value.trim();
            const nameMl = document.getElementById('modNameMl').value.trim();
            const icon = document.getElementById('modIcon').value.trim() || 'fa-solid fa-folder';

            if(!pageKey || !nameEn) {
                alert('Please fill out required fields!');
                return;
            }

            const cfg = await getSavedConfig();

            if(!cfg.sidebar[activePageKey]) {
                cfg.sidebar[activePageKey] = { order: 99, nameEn: activePageKey, nameMl: activePageKey, icon: "fa-solid fa-folder", show: true, enable: true, modules: [] };
            }

            if(!cfg.sidebar[activePageKey].modules) {
                cfg.sidebar[activePageKey].modules = [];
            }

            cfg.sidebar[activePageKey].modules.push({
                id: pageKey,
                nameEn: nameEn,
                nameMl: nameMl,
                icon: icon
            });

            await broadcastConfigChange(cfg);
            closeModal();
            await syncUIFromConfig();
            loadPageContent(activePageKey);
        }

        document.addEventListener('DOMContentLoaded', async () => {
            await syncUIFromConfig();
            loadPageContent(activePageKey);
        });
    </script>
</body>
</html>
